<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Trading Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #0b0f14;
    color: #e6edf3;
}

.container {
    margin-top: 30px;
}

h2 {
    font-weight: 600;
}

table {
    background: #12171f;
}

th {
    color: #8b949e;
}

td {
    font-weight: 500;
    color: #ffffff;
}

.card {
    background: #12171f;
    border: none;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

.live-price {
    font-size: 42px;
    font-weight: bold;
    color: #00ffcc;
}

.live-small {
    font-size: 18px;
    color: #9aa4af;
}

.badge-buy {
    background: #00c853;
    color: black;
    font-weight: bold;
}

.badge-sell {
    background: #ff1744;
    color: white;
    font-weight: bold;
}

.badge-hold {
    background: #ffd600;
    color: black;
    font-weight: bold;
}

.market-btn {
    min-width: 120px;
}
</style>
</head>

<body>

<div class="container">

<h2 class="text-center mb-4">📊 Trading Signals Dashboard</h2>

<!-- 🔥 SWITCH -->
<div class="d-flex justify-content-center gap-2 mb-4">
    <button id="btn-crypto" class="btn btn-success market-btn" onclick="setMarket('crypto')">Crypto</button>
    <button id="btn-moex" class="btn btn-warning market-btn" onclick="setMarket('moex')">MOEX</button>
</div>

<!-- 🔥 LIVE -->
<div class="card p-4 mb-4 text-center">

    <h4 id="live-symbol">BTCUSDT</h4>

    <div id="live-price" class="live-price">--</div>

    <div class="live-small mt-2">
        RSI: <span id="live-rsi">--</span> |
        MACD: <span id="live-macd">--</span> |
        CMF: <span id="live-cmf">--</span>
    </div>

    <div class="mt-3">
        <span id="live-signal" class="badge badge-hold">--</span>
    </div>

</div>

<!-- 📊 TABLE -->
<table class="table table-dark table-hover">
<thead>
<tr>
    <th>Symbol</th>
    <th>Price</th>
    <th>RSI</th>
    <th>MACD</th>
    <th>CMF</th>
    <th>Signal</th>
    <th>Time</th>
</tr>
</thead>

<tbody id="signals-body"></tbody>
</table>

</div>

<script>

/* =========================
   🌍 MARKETS
========================= */
let MARKET = "crypto";

const CRYPTO_SYMBOLS = ["BTCUSDT", "ETHUSDT"];
const MOEX_SYMBOLS = ["SBER", "GAZP", "LKOH", "VTBR"];

function getSymbols() {
    return MARKET === "crypto" ? CRYPTO_SYMBOLS : MOEX_SYMBOLS;
}

function setMarket(market) {
    MARKET = market;
    updateButtons();
    loadSignals();
    loadLive();
}

/* =========================
   🎨 BUTTON ACTIVE
========================= */
function updateButtons() {
    document.getElementById("btn-crypto").classList.toggle("active", MARKET === "crypto");
    document.getElementById("btn-moex").classList.toggle("active", MARKET === "moex");
}

/* =========================
   🎨 SIGNAL STYLE
========================= */
function getSignalClass(signal) {
    if (!signal) return "badge-hold";
    if (signal.includes("BUY")) return "badge-buy";
    if (signal.includes("SELL")) return "badge-sell";
    return "badge-hold";
}

/* =========================
   🧠 NORMALIZE
========================= */
function normalizeSignal(a) {
    if (!a) return "HOLD";
    if (typeof a === "string") return a;
    return a.signal ?? "HOLD";
}

/* =========================
   📊 TABLE
========================= */
async function loadSignals() {

    const tbody = document.getElementById("signals-body");
    tbody.innerHTML = "";

    const symbols = getSymbols();

    for (const symbol of symbols) {

        try {
            const res = await fetch(`http://127.0.0.1:8000/analyze/?symbol=${symbol}`);

            if (!res.ok) continue;

            const data = await res.json();

            if (!data || !data.symbol) continue;

            const signal = normalizeSignal(data.analysis);

            tbody.insertAdjacentHTML("beforeend", `
                <tr>
                    <td>${data.symbol}</td>
                    <td><b>${data.price ?? "-"}</b></td>
                    <td>${data.rsi ?? "-"}</td>
                    <td>${data.macd ?? "-"}</td>
                    <td>${data.cmf ?? "-"}</td>
                    <td>
                        <span class="badge ${getSignalClass(signal)}">
                            ${signal}
                        </span>
                    </td>
                    <td>now</td>
                </tr>
            `);

        } catch (e) {
            console.error("ERROR symbol:", symbol, e);
        }
    }
}
/* =========================
   🚀 LIVE
========================= */
async function loadLive() {

    const symbols = getSymbols();
    const symbol = symbols[0];

    try {
        const res = await fetch(`http://127.0.0.1:8000/analyze/?symbol=${symbol}`);

        if (!res.ok) return;

        const data = await res.json();

        if (!data) return;

        document.getElementById("live-symbol").innerText = data.symbol ?? "-";
        document.getElementById("live-price").innerText = data.price ?? "-";

        document.getElementById("live-rsi").innerText = data.rsi ?? "-";
        document.getElementById("live-macd").innerText = data.macd ?? "-";
        document.getElementById("live-cmf").innerText = data.cmf ?? "-";

        const signal = normalizeSignal(data.analysis);

        const el = document.getElementById("live-signal");
        el.innerText = signal;
        el.className = "badge " + getSignalClass(signal);

    } catch (e) {
        console.error("LIVE ERROR:", e);
    }
}
/* =========================
   🔁 AUTO UPDATE
========================= */
setInterval(() => {
    loadSignals();
    loadLive();
}, 5000);

/* INIT */
updateButtons();
loadSignals();
loadLive();

</script>

</body>
</html>
