<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Trading Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b0f14;
            color: #e6edf3;
        }

        .container {
            margin-top: 30px;
        }

        h2 {
            font-weight: 600;
        }

        table {
            background: #12171f;
        }

        th {
            color: #8b949e;
        }

        td {
            font-weight: 500;
            color: #ffffff;
        }

        .card {
            background: #12171f;
            border: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

        .live-price {
            font-size: 42px;
            font-weight: bold;
            color: #00ffcc;
        }

        .live-small {
            font-size: 18px;
            color: #9aa4af;
        }

        .badge-buy {
            background: #00c853;
            color: black;
            font-weight: bold;
        }

        .badge-sell {
            background: #ff1744;
            color: white;
            font-weight: bold;
        }

        .badge-hold {
            background: #ffd600;
            color: black;
            font-weight: bold;
        }

        input {
            background: #12171f !important;
            color: white !important;
            border: 1px solid #2a2f38 !important;
        }

    </style>
</head>

<body>

<div class="container">

    <h2 class="text-center mb-4">📊 Trading Signals Dashboard (LIVE)</h2>

    <!-- 🔥 LIVE БЛОК -->
    <div class="card p-4 mb-4 text-center">

        <h4 id="live-symbol">BTCUSDT</h4>

        <div id="live-price" class="live-price">--</div>

        <div class="live-small mt-2">
            RSI: <span id="live-rsi">--</span> |
            MACD: <span id="live-macd">--</span> |
            CMF: <span id="live-cmf">--</span>
        </div>

        <div class="mt-3">
            <span id="live-signal" class="badge badge-hold">--</span>
        </div>

    </div>

    <!-- 🔍 ФИЛЬТР -->
    <div class="mb-3 d-flex gap-2">
        <input id="symbolFilter" class="form-control" value="BTCUSDT">
        <button class="btn btn-primary" onclick="loadSignals()">Применить</button>
    </div>

    <!-- 📊 ТАБЛИЦА -->
    <table class="table table-dark table-hover">
        <thead>
        <tr>
            <th>Symbol</th>
            <th>Price</th>
            <th>RSI</th>
            <th>MACD</th>
            <th>CMF</th>
            <th>Signal</th>
            <th>Time</th>
        </tr>
        </thead>

        <tbody id="signals-body"></tbody>
    </table>

</div>

<script>

/* =========================
   🎨 ЦВЕТ СИГНАЛА
========================= */
function getSignalClass(signal) {
    if (!signal) return "badge-hold";

    if (signal.includes("BUY")) return "badge-buy";
    if (signal.includes("SELL")) return "badge-sell";

    return "badge-hold";
}


/* =========================
   📊 ТАБЛИЦА
========================= */
async function loadSignals() {

    let symbol = document.getElementById("symbolFilter").value || "BTCUSDT";

    let url = `http://127.0.0.1:8000/signals/?symbol=${symbol}`;

    const res = await fetch(url);
    const data = await res.json();

    const tbody = document.getElementById("signals-body");
    tbody.innerHTML = "";

    data.forEach(s => {

        tbody.innerHTML += `
            <tr>
                <td>${s.symbol}</td>
                <td><b>${s.price}</b></td>
                <td>${s.rsi ?? "-"}</td>
                <td>${s.macd ?? "-"}</td>
                <td>${s.cmf ?? "-"}</td>
                <td>
                    <span class="badge ${getSignalClass(s.analysis)}">
                        ${s.analysis ?? "HOLD"}
                    </span>
                </td>
                <td>${new Date(s.created_at).toLocaleString()}</td>
            </tr>
        `;
    });
}


/* =========================
   🚀 LIVE ДАННЫЕ
========================= */
async function loadLive() {

    let symbol = document.getElementById("symbolFilter").value || "BTCUSDT";

    const res = await fetch(`http://127.0.0.1:8000/analyze/?symbol=${symbol}`);
    const data = await res.json();

    document.getElementById("live-symbol").innerText = data.symbol;
    document.getElementById("live-price").innerText = data.price;

    document.getElementById("live-rsi").innerText = data.rsi ?? "-";
    document.getElementById("live-macd").innerText = data.macd ?? "-";
    document.getElementById("live-cmf").innerText = data.cmf ?? "-";

    const signalEl = document.getElementById("live-signal");
    signalEl.innerText = data.analysis ?? "HOLD";
    signalEl.className = "badge " + getSignalClass(data.analysis);
}


/* =========================
   🔁 АВТООБНОВЛЕНИЕ
========================= */
setInterval(() => {
    loadSignals();
    loadLive();
}, 4000);


/* первый запуск */
loadSignals();
loadLive();


/* автофильтр при вводе */
document.getElementById("symbolFilter").addEventListener("input", () => {
    loadSignals();
    loadLive();
});

</script>

</body>
</html>
